$schema: "https://json-schema.org/draft/2020-12/schema"
title: Configuration
description: CenMAP configuration options.
properties:
  output_dir:
    type: string
    description: Output directory.
    default: results
  log_dir:
    type: string
    description: Log directory.
    default: logs
  benchmark_dir:
    type: string
    description: Benchmark directory. Runtime and memory usage is displayed here.
    default: benchmarks
  chromosomes:
    type: array
    items:
      type: string
      enum: [
        "chr1",
        "chr2",
        "chr3",
        "chr4",
        "chr5",
        "chr6",
        "chr7",
        "chr8",
        "chr9",
        "chr10",
        "chr11",
        "chr12",
        "chr13",
        "chr14",
        "chr15",
        "chr16",
        "chr17",
        "chr18",
        "chr19",
        "chr20",
        "chr21",
        "chr22",
        "chrX",
        "chrY",
      ]
    description: "Chromosomes to evaluate.\n\n
      * Specifying `[]` disables assigning chromosome names to assembly contigs and reorienting relative to CHM13v2.\n\n
      * This is desirable if your assembly contigs are already assigned and oriented."
  samples:
    type: array
    items:
      type: string
    description: Sample names.
  container:
    type: string
    description: "Container for workflow.\n\n
      * Only applicable if running using `Snakemake` and the `--sdm singularity` flag."
    default: "docker://logsdonlab/cenmap:latest"
  # Rules
  concat_asm:
    type: object
    additionalProperties: false
    description: Configuration for concatenating given assemblies.
    properties:
      input_dir:
        description: "Input directory for genome assemblies.\n\n
          * Should have format `{dir}/{sample}/` and include all contigs as fasta or gzipped fasta files."
        type: string
      mem:
        type: string
        pattern: "\\d+GB"
        default: 20GB
    required:
      - input_dir
  ident_cen_ctgs:
    type: object
    description: >-
      Configuration for identifying centromeric contigs using [srf](https://github.com/lh3/srf) and [trf](https://github.com/lh3/TRF-mod)
      with [srf-n-trf](https://anaconda.org/channels/bioconda/packages/srf-n-trf/overview).
    additionalProperties: false
    properties:
      reference:
        type: ["string", "null"]
        description: Path to reference assembly. Will download CHM13v2.0 if not specified.
        default: null
      threads_srf:
        type: integer
        default: 16
      mem_srf:
        type: string
        pattern: "\\d+GB"
        default: 12GB
      threads_aln:
        type: integer
        default: 8
      mem_aln:
        type: string
        pattern: "\\d+GB"
        default: 20GB
      monomer_periods:
        type: array
        items:
          type: integer
        description: "Monomer periods to search for.\n\n
          * The smallest period is used as kmer size.\n\n
          * The monomer size `42` is added internally for HSAT-1A (SAR)."
        default: [170, 340]
      exclude_kmers_lt_n:
        type: integer
        description: "Filter kmers occuring less than n times.\n\n
          * Corresponds to `kmc`'s `ci` parameter.\n\n
          * Smaller value will pick up smaller, infrequent HORs at the cost of mapping runtime."
        default: 10
      bp_min_length:
        type: integer
        description: "Minimum length of satellite repeat groups.\n\n
          * Occurs after grouping but before merging.\n\n
          * Allows removing small false-positive TRs matching required `171`/`42` bp periods."
        default: 30000
      bp_merge:
        type: integer
        description: "Merge grouped satellite repeat blocks n base pairs.\n\n
          * Smaller values will reduce the length of p-arms of the acrocentric chromosomes but at the risk of considering monomeric/divergent HORs in p-arm acrocentric chromosomes as a correct centromere.\n\n
          * The `repeatmasker.bp_shannon_window` parameter should be increased as well to prevent this."
        default: 100000
      bp_slop:
        type: integer
        description: Add n base pairs to extend edges of query HOR array.
        default: 1000000
      perc_mon_len_diff:
        type: number
        # TODO: Tune more (2.0 > 1.0). Some HSAT-1A contains trf monomers that are close (168).
        description: "Percent difference in monomer length to allow motif based on: `100 * ((motif_len % monomer_length) / monomer_length)`"
        default: 2.0
      perc_multi_chrom:
        type: number
        description: Percent of mapped reference chromosome required to add to name.
        default: 5.0
      paf2bed_min_ident:
        type: number
        description: Minimum identity (`-d`) for `srfutils.js paf2bed`.
        default: 70.0
  nucflag:
    type: object
    additionalProperties: false
    description: "Configuration for [NucFlag](https://github.com/logsdon-lab/NucFlag) and correctness check of QC.\n\n
      * Regions are considered correct if nothing is flagged by `NucFlag`."
    properties:
      input_hifi_reads_fofn_dir:
        type: string
        description: "Directory of hifi read fofn files.\n\n
          * Each file in this directory is named `{sample}.fofn`."
      input_hifi_reads_dir:
        type: string
        description: "Directory of hifi reads.\n\n
          * Searched recursively for files in `{dir}/{sample}/` matching reads_rgx."
      reads_rgx:
        type: string
        description: Regular expression to find hifi reads if `input_hifi_reads_dir` is provided.
        default: ".*\\.fastq.gz$"
      config_nucflag:
        type: string
        description: Path to `NucFlag` config file.
        default: "config/nucflag.toml"
      ignore_regions:
        type: ["string", "null"]
        description: Path to BED file with regions to ignore in the assembly.
        default: null
      threads_aln:
        type: integer
        default: 8
      processes_nucflag:
        type: integer
        default: 12
      mem_nucflag:
        type: string
        pattern: "\\d+GB"
        default: 30GB
      mem_aln:
        type: string
        pattern: "\\d+GB"
        default: 60GB
      samtools_view_flag:
        type: integer
        description: Filter flag to use when filtering reads from alignment.
        default: 2308
      ignore_type:
        type: string
        description: Restrict check to asat or live asat.
        enum: [asat, live_asat]
        default: asat
  repeatmasker:
    type: object
    additionalProperties: false
    description: "Configuration for [RepeatMasker](https://www.repeatmasker.org/) and completeness check of QC.\n\n
      * Regions are considered complete if entire array is surrounded by unique sequence.\n\n
      * Omitting this block will omit `RepeatMasker` and attempt to determine partial centromeres via windowed shannon entropy of kmers via `censtats kmer-entropy`."
    properties:
      ref_repeatmasker_output:
        type: array
        items:
          type: string
        description: >-
          Path of `RepeatMasker` outputs from reference assemblies. Used for visualization.
        default: [
          data/annotations/chm13_chm1_cens_v21.trimmed.fa.noheader.out
        ]
      bp_shannon_window:
        type: integer
        description: "Window size to use in calculating shannon index for region filtering.\n\n
          * Smaller windows allow smaller centromeres but may increase the number of false-positives. (ex. monomeric/divergent alpha-satellite or p-arm fragments of acrocentric chromosomes)"
        default: 5000
      omit_shannon_plots:
        type: boolean
        description: Omit entropy plots.
        default: true
      trim_to_repeats:
        type: array
        items:
          type: string
        description: Trim centromeric regions to the largest block of these `RepeatMasker` repeat annotations.
        default: []
        # default: ["ALR/Alpha", "SAR"]
      repeat_colors:
        type: string
        description: "Path to JSON file of repeat colors."
        default: config/repeatmasker_colors.json
      species:
        type: string
        description: "`RepeatMasker` species."
        default: human
      threads:
        type: integer
        default: 12
      bp_slop:
        type: integer
        description: Distance to add to region after trimming. If `null`, defaults to `ident_cen_ctgs.bp_slop`.
      partition_by:
        type: array
        items:
          type: string
          enum: [chromosome, sample]
        description: Partition data to visualize by chromosome or sample.
        default: [chromosome]
  humas_annot:
    type: object
    additionalProperties: false
    description: Configuration for alpha-satellite HOR annotation.
    properties:
      mode:
        type: string
        enum: ["sd", "hmmer", "srf-n-trf", "sf"]
        default: sd
        description: Annotate centromere by reference-based approaches (`sd`, `hmmer`, `sf`) or the monomers found from `srf`/`trf-mod` (`str-n-trf`).
      threads:
        type: integer
        default: 6
      mem:
        type: string
        pattern: "\\d+GB"
        default: 30GB
      hmm_profile:
        type: string
        default: data/models/AS-HORs-hmmer3.4-071024.hmm.gz
        description: Path to nhmmer HMM profile used with `HumAS-HMMER` to use as HOR variant database.
  plot_hor_stv:
    type: object
    additionalProperties: false
    description: Configuration for plotting HOR structural variant plots.
    properties:
      ref_stv:
        type: array
        items:
          type: string
        description: Path to reference HOR stv annotations to plot.
        default: [
          data/annotations/AS-HOR-vs-chm1_cens_v21.stv_row.all.bed,
          data/annotations/AS-HOR-vs-chm13_cens_v18.stv_row.all.bed
        ]
      sat_annot_colors:
        type: string
        description: Path to mapping file of satellite annotations to colors.
        default: config/repeatmasker_sat_annot_colors.json
      stv_annot_colors:
        type: string
        description: Path to mapping file of HOR stv monomer numbers to colors.
        default: config/stv_annot_colors.tsv
      sf_annot_colors:
        type: string
        description: Path to mapping file of HOR stv monomer numbers to colors.
        default: config/sf_annot_colors.tsv
      partition_by:
        type: array
        items:
          type: string
          enum: [chromosome, sample]
        description: Partition data to visualize by chromosome or sample.
        default: [chromosome]
  calculate_hor_length:
    type: object
    additionalProperties: false
    description: Configuration for determing HOR array length and plots.
    properties:
      ref_hor_lengths:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              description: Name of assembly.
            color:
              type: ["string", "null"]
              default: null
              description: Color of dot in violin plot. If null, random color.
            path:
              type: string
              description: Path to BED file of reference HOR array lengths.
          required:
            - name
            - path
      chromosome_colors:
        type: string
        description: Path to mapping file of chromosome names to colors.
        default: config/chrom_colors.tsv
  moddotplot:
    type: object
    description: "Configuration for [ModDotPlot](https://github.com/marbl/ModDotPlot).\n\n
      * We use a lightweight port of the self-identity functionality in [CenStats](https://github.com/logsdon-lab/CenStats)."
    additionalProperties: false
    properties:
      mem:
        type: string
        pattern: "\\d+GB"
        default: 10GB
      ident_thr:
        type: number
        default: 70.0
        description: Sequence identity threshold for `ModDotPlot`
      window:
        type: integer
        default: 5000
        description: Window size passed to `ModDotPlot`
  ideogram:
    type: object
    additionalProperties: false
    description: Configuration for contig-level ideogram plot.
    properties:
      title:
        type: string
        default: "{sm}"
        description: Plot title. If `{sm}` is present, replaced with sample name.
      height:
        type: integer
        default: 15
        description: Plot height.
      width:
        type: integer
        default: 5
        description: Plot width.
      legend_prop:
        type: number
        default: 0.1
        description: Legend proportion of plot. Increase if contig names long.
      use_renamed_reoriented:
        type: boolean
        default: true
        description: Use renamed and reoriented coordinates.
  cdr_finder:
    type: object
    description: "`CDR-Finder` configuration.\n\n
      * For more information or examples on parameters and tuning, see [here](https://github.com/logsdon-lab/CDR-Finder?tab=readme-ov-file#parameters)."
    additionalProperties: false
    properties:
      aligner:
        type: string
        enum: ["minimap2", "winnowmap"]
      input_bam_fofn_dir:
        type: string
        description: "Directory of read fofn files.\n\n
          * Each file in this directory is named `{sample}.fofn`."
      input_bam_dir:
        type: string
        description: Path to directory with methyl BAM files. Searches recursively for files matching `bam_rgx`.
      bam_rgx:
        type: string
        description: "Regular expression to search input_bam_dir for methyl BAM files.\n\n
          * Despite the name, also supports gzipped fastq files if `MM` and `ML` tags are in name."
      aln_mem:
        type: string
        pattern: "\\d+GB"
        default: 50GB
      aln_threads:
        type: integer
        default: 12
      window_size:
        type: integer
        description: Window size to average methylation percent.
        default: 5000
      alr_threshold:
        type: integer
        description: Number of bp required for merged intervals of alpha-satellite repeat annotations.
        default: 100000
      bp_merge:
        type: integer
        description: Merge distance for CDRs.
        default: 1
      bp_alr_merge:
        type: integer
        description: Merge distance of alpha-satellite repeats.
        default: 8000
      bp_edge:
        type: integer
        description: Number of base pairs at edges adjacent to CDR to estimate height.
        default: 500000
      height_perc_valley_threshold:
        type: number
        description: Required CDR height threshold.
        default: 0.2
      prom_perc_valley_threshold:
        type: number
        description: Required CDR prominence threshold.
        default: 0.1
      extend_edges_std:
        type: integer
        description: Extend CDRs along edges as long as height is less than mean + set standard deviation value.
        default: -1
      baseline_avg_methyl:
        type: number
        description: Baseline expected average methylation. Scales thresholds if average methylation is below value, reducing false positives.
        default: 0.4
      use_srf_regions:
        type: boolean
        description: "Use `srf-n-trf` regions instead of `RepeatMasker` output as putative alpha-satellite region.\n\n
          * Merge based on `bp_alr_merge` and region minimum size based on `alr_threshold`."
        default: false
      edge_height_heuristic:
        type: string
        enum: ["min", "avg", "max"]
        default: avg
        description: "Heuristic used when determining edge height of CDR.\n\n
          * Either min, avg, or max (By decreasing strictness)."
      filter_by_live_hor:
        type: boolean
        description: "Use HOR annotation to filter CDRs.\n\n
          * Only applied to human annotation modes, `sd` and `hmmer`."
        default: true
    required:
      - input_bam_dir
      - bam_rgx
  get_complete_correct_cens:
    type: object
    additionalProperties: false
    properties:
      filter_by_live_hor:
        type: boolean
        description: "Use HOR annotation to filter out non-live alpha-satellite HOR centromeres.\n\n
          * Only applied to human annotation modes, `sd` and `hmmer`."
        default: true
required:
  - samples
  - concat_asm
  - ident_cen_ctgs
